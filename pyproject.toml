[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "typethru"
version = "0.1.0"
description = "Apply a git diff by retyping it: no agent-generated change lands without passing through your fingers"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Pranav Yerramaneni" }]
keywords = ["git", "diff", "typing", "ai", "code-review", "tui"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Version Control :: Git",
]
dependencies = ["prompt_toolkit==3.0.53"]

[project.urls]
Homepage = "https://github.com/DevMello/typethru"

[project.scripts]
typethru = "typethru.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
